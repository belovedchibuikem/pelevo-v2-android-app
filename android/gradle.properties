# This machine has ~8 GB RAM. Flutter's default -Xmx8G + 4G metaspace
# exhausts native memory during R8 and kills the Gradle daemon.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1g
android.useAndroidX=true
android.enableJetifier=true
