# Cap heap for ~8 GB RAM machines (Flutter template defaults are -Xmx8G).
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1g
android.useAndroidX=true
# Keep native libs uncompressed so Play zip-aligns them to 16 KB in APKs.
android.bundle.enableUncompressedNativeLibs=true
# Full mode stripped WorkManager/Room reflection (crash on open). Compatibility
# mode + explicit keep rules in app/proguard-rules.pro.
android.enableR8.fullMode=false
# Flutter 3.47 / AGP 9: built-in Kotlin on (plugins upgraded off kotlin-android).
# Keep legacy DSL until remaining plugins finish new-DSL migration.
android.newDsl=false
android.builtInKotlin=true

# Tolerate flaky DNS / slow Maven; keep retries low so builds fail fast on outages.
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.repository.max.retries=3
systemProp.org.gradle.internal.repository.max.timeout.ms=60000
