# Pelevo iOS.
# Preview = compile only (unsigned .app zip if no Apple keys; signed IPA if keys exist). No store submit.
# App Store = signed IPA, then submit 5.2.0 for review (needs Apple keys + listing filled).

workflows:
  ios-preview:
    name: iOS Preview (compile)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      groups:
        - pelevo_ios
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.podemeraldsltd.pelevo
        APP_STORE_APPLE_ID: "6752672316"
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Build iOS
        script: bash ios/ci/build_ipa.sh
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/ipa/*.zip
      - build/ios/iphoneos/*.app
      - build/app/outputs/symbols
      - /tmp/xcodebuild_logs/*.log

  ios-app-store:
    name: iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      groups:
        - pelevo_ios
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.podemeraldsltd.pelevo
        APP_STORE_APPLE_ID: "6752672316"
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Build signed IPA
        script: bash ios/ci/build_ipa.sh
    artifacts:
      - build/ios/ipa/*.ipa
      - build/app/outputs/symbols
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
        submit_to_app_store: true
        release_type: MANUAL
